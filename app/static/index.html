<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwick AI Ops</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e4e7ec;--brand:#0f6b5c;--brand2:#e7f4f1;--warn:#b54708;--warnbg:#fef0c7;--bad:#b42318;--badbg:#fee4e2;--ok:#067647;--okbg:#d1fadf;--info:#175cd3;--infobg:#e0eaff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mute:#98a2b3;--line:#2a303a;--brand:#3fbfa8;--brand2:#13302b;--warnbg:#3b2a0a;--warn:#f5b04c;--bad:#ff8a80;--badbg:#3a1613;--ok:#6ce9a6;--okbg:#0f2d1e;--info:#8fb4ff;--infobg:#142447}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;color:var(--brand)}nav{display:flex;gap:4px;flex:1}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5}main{padding:16px 20px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:320px 1fr 380px;gap:14px;height:calc(100vh - 90px)}
@media(max-width:1000px){.grid{grid-template-columns:1fr;height:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.conv{padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent}.conv:hover{background:var(--brand2)}.conv.on{background:var(--brand2);border-color:var(--brand)}
.conv small{color:var(--mute)}.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;margin-right:4px}
.p-escalated,.p-needs_human,.p-critical{background:var(--badbg);color:var(--bad)}.p-open,.p-pending{background:var(--warnbg);color:var(--warn)}.p-resolved,.p-sent,.p-approved{background:var(--okbg);color:var(--ok)}
.p-edited{background:var(--infobg);color:var(--info)}.p-rejected{background:var(--badbg);color:var(--bad)}.p-agent{background:var(--brand2);color:var(--brand)}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.msg.customer{background:var(--brand2);margin-right:auto}.msg.assistant{background:var(--infobg);margin-left:auto}
.draft{border:1px dashed var(--warn);background:var(--warnbg);border-radius:10px;padding:10px;margin:8px 0}.draft textarea{width:100%;min-height:90px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.cite{font-size:12px;color:var(--mute);border-left:3px solid var(--brand);padding-left:8px;margin:4px 0}
.trace{border-left:2px solid var(--line);padding:4px 0 4px 12px;margin:0 0 6px 6px;position:relative}.trace:before{content:"";position:absolute;left:-6px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.trace.tool:before{background:var(--info)}.trace.escalate:before{background:var(--bad)}.trace pre{margin:4px 0 0;white-space:pre-wrap;font-size:11.5px;background:var(--bg);padding:6px;border-radius:6px;max-height:140px;overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--mute);font-weight:600}
#login{max-width:340px;margin:12vh auto;text-align:center}#login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mute{color:var(--mute)}.live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.hidden{display:none}
</style>
</head>
<body>
<div id="login" class="card"><h1 style="color:var(--brand)">Northwick AI Ops</h1><p class="mute">Sign in to the operations dashboard</p>
<input id="em" placeholder="Email" value="admin@cadral.test"><input id="pw" type="password" placeholder="Password">
<button class="btn primary" style="width:100%" onclick="login()">Sign in</button><p id="lerr" style="color:var(--bad)"></p></div>
<div id="app" class="hidden">
<header><h1>Northwick AI Ops</h1><nav id="nav"></nav><span class="mute"><span class="live"></span><span id="who"></span></span><button class="btn" onclick="logout()">Sign out</button></header>
<main id="view"></main></div>
<script>
let TOKEN=localStorage.getItem('tok'),ME=null,TAB='inbox',CUR=null,ES=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN,...(o.headers||{})}});if(r.status==401){logout();throw 0}if(!r.ok)throw new Error((await r.json()).detail||r.status);return r.json()}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});if(!r.ok)throw 0;const d=await r.json();TOKEN=d.token;localStorage.setItem('tok',TOKEN);init()}catch{$('#lerr').textContent='Invalid credentials'}}
function logout(){localStorage.removeItem('tok');TOKEN=null;if(ES)ES.close();$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
async function init(){if(!TOKEN)return;try{ME=await api('/me')}catch{return}
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=ME.email+' ('+ME.role+')';
 const tabs=[['inbox','Conversations'],['analytics','Analytics']].concat(ME.role=='admin'?[['feedback','Learning loop'],['ops','Operations']]:[]);
 $('#nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');go(TAB);live()}
function go(t){TAB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({inbox,analytics,feedbackTab,ops})[t]()}
let deb;function live(){if(ES)ES.close();ES=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));
 ES.onmessage=e=>{const ev=JSON.parse(e.data);
  if(ev.type=='stream'&&CUR==ev.conversation_id){let el=$('#stream');if(!el){const b=document.createElement('div');b.className='msg assistant';b.id='stream';b.style.opacity=.6;$('#msgs').appendChild(b);el=b}el.textContent+=ev.delta;$('#msgs').scrollTop=1e9;return}
  if(TAB=='inbox'&&['message','reply_pending','reply_reviewed','trace','stream_end'].includes(ev.type)){clearTimeout(deb);deb=setTimeout(()=>{loadList();if(CUR==ev.conversation_id)openConv(CUR,true)},ev.type=='trace'?400:150)}}}
// ---------------- inbox
async function inbox(){$('#view').innerHTML=`<div class="grid"><div class="card"><h3>Conversations <span id="cnt"></span></h3><div class="row" style="margin-bottom:8px"><select id="flt" onchange="loadList()"><option value="">All</option><option value="escalated">Escalated</option><option value="needs_human">Needs human</option><option value="open">Open</option><option value="resolved">Resolved</option></select></div><div id="list"></div></div>
<div class="card" id="chat"><p class="mute">Select a conversation. Replies stream here live as the agents write them.</p></div><div class="card" id="side"><h3>Agent trace</h3><p class="mute">Which agent handled it, which tools ran, and why.</p></div></div>`;loadList()}
async function loadList(){const s=$('#flt')?.value;const rows=await api('/conversations'+(s?'?status='+s:''));$('#cnt').textContent='('+rows.length+')';
 $('#list').innerHTML=rows.map(c=>`<div class="conv ${c.id==CUR?'on':''}" onclick="openConv(${c.id})"><div class="row"><b>#${c.id}</b> <span class="pill p-agent">${c.channel}</span><span class="pill p-${c.status}">${c.status}</span>${c.pending?'<span class="pill p-pending">review</span>':''}</div><div>${esc(c.customer_name||c.customer_email)}</div><small>${esc((c.last_msg||'').slice(0,70))}</small></div>`).join('')||'<p class="mute">No conversations yet. Open /chat to send one.</p>'}
async function openConv(id,quiet){CUR=id;const d=await api('/conversations/'+id);if(!quiet)loadList();
 const pend=d.replies.filter(r=>r.status=='pending');
 let h=`<div class="row"><h3 style="margin:0">#${id} · ${esc(d.conversation.customer_email)}</h3><span class="pill p-${d.conversation.status}">${d.conversation.status}</span></div><div id="msgs" style="max-height:48vh;overflow:auto;margin-top:8px">`+d.messages.map(m=>`<div class="msg ${m.role}">${esc(m.content)}${m.agent?`<div class="mute" style="font-size:11px">${m.agent} agent</div>`:''}</div>`).join('')+'</div>';
 if(d.escalation)h+=`<div class="draft" style="border-color:var(--bad);background:var(--badbg)"><b>Escalation (${d.escalation.severity})</b><pre style="white-space:pre-wrap;margin:6px 0 0;font:inherit">${esc(d.escalation.summary)}</pre></div>`;
 pend.forEach(r=>{h+=`<div class="draft"><div class="row"><b>Draft from ${r.agent} agent</b><span class="mute">confidence ${(r.confidence*100).toFixed(0)}% · ${Math.round(r.latency_ms)}ms · $${(r.cost_usd||0).toFixed(5)}</span></div>
  <textarea id="ed${r.id}">${esc(r.draft)}</textarea>${r.citations.map((c,i)=>`<div class="cite">[${i+1}] ${esc(c.doc)} (${c.kind}) — ${esc(c.snippet.slice(0,140))}…</div>`).join('')}
  <input id="note${r.id}" placeholder="Optional note → becomes a standing guideline for future replies" style="width:100%;margin:6px 0;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)">
  <div class="row"><button class="btn primary" onclick="rev(${r.id},'approve')">Approve & send</button><button class="btn" onclick="rev(${r.id},'edit')">Send edited</button><button class="btn bad" onclick="rev(${r.id},'reject')">Reject</button></div></div>`});
 const done=d.replies.filter(r=>r.status!='pending');if(done.length)h+='<h3 style="margin-top:14px">Reply history</h3>'+done.map(r=>`<div class="cite"><span class="pill p-${r.status}">${r.status}</span><span class="pill p-agent">${r.agent}</span>${r.auto?'auto-sent · ':''}${(r.confidence*100).toFixed(0)}% · ${Math.round(r.latency_ms)}ms${r.citations.length?' · cites '+r.citations.map(c=>c.doc).join(', '):''}</div>`).join('');
 $('#chat').innerHTML=h;$('#msgs').scrollTop=1e9;
 const m=d.memory;let s='<h3>Agent trace</h3>'+d.traces.map(t=>{const x=t.detail;let body='';
  if(t.step=='route')body=`<b>→ ${x.agent}</b> (${(x.confidence*100|0)}%) <span class="mute">${esc(x.engine)}</span><br>${esc(x.reason)}`;
  else if(t.step=='tool_call')body=`<b>${x.tool}</b>(${esc(JSON.stringify(x.args))})<br><span class="mute">why: ${esc(x.why)}</span><pre>${esc(JSON.stringify(x.result,null,1))}</pre>`;
  else if(t.step=='retrieve')body=`answerable: <b>${x.answerable}</b><pre>${esc(x.hits.map(h=>h.id+'  score '+h.score+'  bm25 '+h.bm25+'  vec '+h.vec).join('\n'))}</pre>`;
  else if(t.step=='escalate')body=`<b>${x.severity}</b> · ${esc(x.signals.join(', '))}`;
  else body=`<pre>${esc(JSON.stringify(x,null,1))}</pre>`;
  return `<div class="trace ${t.step=='tool_call'?'tool':t.step=='escalate'?'escalate':''}"><span class="pill p-agent">${t.agent}</span> <b>${t.step}</b><div>${body}</div></div>`}).join('');
 s+=`<h3 style="margin-top:14px">Shared memory</h3><div class="mute">${esc(m.customer.name||'?')} · ${m.customer.tier}<br>${m.past_conversations.length} earlier chats · ${m.prior_escalations} escalations · ${m.refund_count} refunds<br>Recent: ${m.recent_orders.map(o=>o.id+' ('+o.status+')').join(', ')}</div>`;
 $('#side').innerHTML=s}
async function rev(id,action){const text=$('#ed'+id).value,note=$('#note'+id).value;try{await api('/replies/'+id+'/review',{method:'POST',body:JSON.stringify({action,text,note})});openConv(CUR)}catch(e){alert(e.message)}}
// ---------------- analytics
async function analytics(){const a=await api('/analytics?days=7');const k=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
 const pts=a.accuracy_over_time;const W=560,H=160,P=28;const line=pts.map((p,i)=>`${P+(pts.length>1?i*(W-2*P)/(pts.length-1):(W-2*P)/2)},${H-P-(p.accuracy_pct/100)*(H-2*P)}`).join(' ');
 const mx=Math.max(1,...Object.values(a.by_agent));
 $('#view').innerHTML=`<div class="kpis">${k(a.auto_resolution_pct+'%','Auto-resolution rate')}${k((a.avg_response_ms/1000).toFixed(2)+'s','Avg response time')}${k('$'+a.cost_per_conversation_usd,'Cost per conversation (list price)')}${k(a.accuracy_pct+'%','AI accuracy (not edited/rejected)')}${k(a.conversations,'Conversations (7d)')}${k(a.escalations,'Escalations')}${k(a.refunds_issued+' · £'+a.refunds_gbp,'Refunds issued')}${k(a.pending_review,'Awaiting review')}</div>
 <div class="row" style="align-items:stretch"><div class="card" style="flex:1;min-width:320px"><h3>Accuracy over time</h3><svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/><line x1="${P}" y1="${P}" x2="${P}" y2="${H-P}" stroke="var(--line)"/><text x="2" y="${P+4}" fill="var(--mute)" font-size="10">100%</text><text x="8" y="${H-P}" fill="var(--mute)" font-size="10">0</text>
 <polyline fill="none" stroke="var(--brand)" stroke-width="2.5" points="${line}"/>${pts.map((p,i)=>{const x=P+(pts.length>1?i*(W-2*P)/(pts.length-1):(W-2*P)/2);return `<circle cx="${x}" cy="${H-P-(p.accuracy_pct/100)*(H-2*P)}" r="4" fill="var(--brand)"><title>${p.day}: ${p.accuracy_pct}% (n=${p.n})</title></circle><text x="${x}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mute)">${p.day.slice(5)}</text>`}).join('')}</svg></div>
 <div class="card" style="flex:1;min-width:280px"><h3>Replies by agent</h3>${Object.entries(a.by_agent).map(([n,v])=>`<div class="row"><span style="width:90px">${n}</span><div style="height:14px;background:var(--brand);border-radius:4px;width:${v/mx*60}%;min-width:4px"></div> ${v}</div>`).join('')||'<span class="mute">no data</span>'}
 <h3 style="margin-top:16px">Cost & latency</h3><table><tr><td>LLM calls</td><td>${a.llm_calls}</td></tr><tr><td>Tokens</td><td>${a.total_tokens}</td></tr><tr><td>Total cost (list price)</td><td>$${a.total_cost_usd}</td></tr><tr><td>Avg LLM latency</td><td>${a.avg_llm_latency_ms} ms</td></tr></table></div></div>`}
// ---------------- learning loop (admin)
async function feedbackTab(){const f=await api('/feedback');$('#view').innerHTML=`<div class="card"><div class="row"><h3 style="margin:0;flex:1">Human corrections → improvement</h3><button class="btn primary" onclick="exp()">Export re-training dataset (JSONL)</button></div><p class="mute">Edits and rejections are (1) injected as few-shot corrections into future prompts, (2) notes become standing guidelines, (3) exported as a fine-tuning dataset.</p><div id="exp"></div>
 <table><tr><th>#</th><th>Action</th><th>Customer message</th><th>AI reply</th><th>Human reply / note</th><th>By</th></tr>${f.map(r=>`<tr><td>${r.id}</td><td><span class="pill p-${r.action=='approved'?'approved':r.action}">${r.action}</span></td><td>${esc(r.user_message.slice(0,80))}</td><td>${esc((r.ai_reply||'').slice(0,80))}</td><td>${esc((r.human_reply||'').slice(0,80))}<br><i>${esc(r.note||'')}</i></td><td>${esc(r.reviewer)}</td></tr>`).join('')}</table></div>`}
async function exp(){const r=await api('/feedback/export',{method:'POST'});$('#exp').innerHTML=`<p>Exported <b>${r.examples}</b> examples to <code>${esc(r.path)}</code></p>`}
// ---------------- ops (admin)
async function ops(){const [s,rf,ob,es]=await Promise.all([api('/system'),api('/refunds'),api('/outbox'),api('/escalations')]);
 $('#view').innerHTML=`<div class="kpis"><div class="kpi"><b style="font-size:16px">${esc(s.llm)}</b><span>LLM engine</span></div><div class="kpi"><b>${s.kb_docs} docs</b><span>${s.kb_chunks} chunks in hybrid index</span></div><div class="kpi"><b style="font-size:14px">Slack ${s.slack?'✓':'–'} · SMTP ${s.smtp?'✓':'–'} · Telegram ${s.telegram?'✓':'–'} · IMAP ${s.imap?'✓':'–'}</b><span>Integrations</span></div></div>
 <div class="row" style="align-items:flex-start"><div class="card" style="flex:1;min-width:320px"><h3>Refunds</h3><table><tr><th>#</th><th>Order</th><th>£</th><th>Status</th><th></th></tr>${rf.map(r=>`<tr><td>${r.id}</td><td>${r.order_id}</td><td>${r.amount}</td><td><span class="pill p-${r.status=='issued'?'sent':'pending'}">${r.status}</span></td><td>${r.status=='pending_approval'?`<button class="btn" onclick="appr(${r.id})">Approve</button>`:''}</td></tr>`).join('')}</table></div>
 <div class="card" style="flex:1;min-width:320px"><h3>Daily report</h3><button class="btn primary" onclick="rep()">Preview &amp; send now</button><pre id="rep" style="white-space:pre-wrap"></pre><h3>Escalations</h3>${es.map(e=>`<div class="cite"><span class="pill p-${e.severity}">${e.severity}</span>#${e.conversation_id}: ${esc(e.summary.slice(0,140))}</div>`).join('')||'<span class="mute">none</span>'}</div></div>
 <div class="card" style="margin-top:14px"><h3>Outbox (retry queue: Slack / email / Telegram)</h3><table><tr><th>#</th><th>Channel</th><th>To</th><th>Status</th><th>Attempts</th><th>Last error</th><th>Body</th></tr>${ob.slice(0,25).map(o=>`<tr><td>${o.id}</td><td>${o.channel}</td><td>${esc(o.to_addr)}</td><td>${o.status}</td><td>${o.attempts}</td><td>${esc(o.last_error||'')}</td><td>${esc((o.body||'').slice(0,70))}</td></tr>`).join('')}</table></div>`}
async function appr(id){await api('/refunds/'+id+'/approve',{method:'POST'});ops()}
async function rep(){const r=await api('/report/send',{method:'POST'});$('#rep').textContent=r.report}
$('#pw').addEventListener('keydown',e=>e.key=='Enter'&&login());init();
</script>
</body>
</html>
