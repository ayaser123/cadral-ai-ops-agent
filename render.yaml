# One-click free deploy on Render (Docker runtime). Set the secrets in the Render dashboard.
services:
  - type: web
    name: cadral-ai-ops
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_SEED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AGENT_PASSWORD
        sync: false
      - key: MANAGER_EMAIL
        sync: false
